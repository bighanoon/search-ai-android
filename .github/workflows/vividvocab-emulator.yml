name: VividVocab emulator proof

# One-off run: boot VividVocab 1.9.1 in a cloud Android emulator, open it,
# screenshot the first screen, and commit the screenshot back to this branch.
# Triggered by pushing this file to the vividvocab-emulator branch.
#
# Run #5: the APK is now the COMPLETE 1.9.1 XAPK from APKPure's own version
# API (base + config.arm64_v8a.apk with libreactnative.so — the library whose
# absence crashed run #4). Fetched at runtime; nothing is uploaded.
# Emulator moved to API 34 google_apis: that image ships Google's
# libndk_translation.so (ARM translation) for the arm64 splits.

on:
  push:
    branches: [vividvocab-emulator]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  open-app:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Complete 1.9.1 XAPK (base + arm64 split with libreactnative.so) fetched
      # straight from APKPure's version API at runtime — no uploads needed.
      # NOTE: the size marker lives base64-encoded inside each download URL's
      # `c` param (it decodes to dev=...&t=xapk&s=<bytes>&vn=<ver>&vc=<code>),
      # so a plain-text grep for 163864965 finds NOTHING. Parse it with
      # python: strings -> decode the `c` param -> pick vn=1.9.1, s=163864965.
      # (Verified 2026-11-26: this exact logic returns a URL that downloads
      # 163,864,965 bytes, md5 c5f9be863b707be2971bf0e46674c4c7.)
      - name: Download complete VividVocab 1.9.1 XAPK from APKPure
        run: |
          curl -s --fail "https://api.pureapk.com/m/v3/cms/app_version?hl=en-US&package_name=com.vividvocab.android" -H 'x-sv: 29' -H 'x-abis: arm64-v8a,armeabi-v7a,armeabi' -H 'x-gp: 1' -o apkpure_version.bin
          ls -l apkpure_version.bin
          strings apkpure_version.bin > apkpure_strings.txt
          cat > /tmp/pick_xapk_url.py <<'PYEOF'
          import re, base64, urllib.parse, sys
          lines = open('apkpure_strings.txt').read().splitlines()
          def b64d(s):
              s = s.strip()
              s += '=' * (-len(s) % 4)
              return base64.b64decode(s).decode()
          for line in lines:
              m = re.search(r'(https://download\.pureapk\.com/b/XAPK/\S+)', line)
              if not m:
                  continue
              u = m.group(1)
              q = urllib.parse.urlparse(u).query
              c = urllib.parse.parse_qs(q).get('c', [''])[0]
              try:
                  dec = b64d(c.split('|')[2])
              except Exception:
                  continue
              d = dict(p.split('=', 1) for p in dec.split('&') if '=' in p)
              if d.get('vn') == '1.9.1' and d.get('s') == '163864965':
                  print(u)
                  sys.exit(0)
          print('ERROR: no 1.9.1 / 163864965-byte XAPK URL in APKPure response', file=sys.stderr)
          sys.exit(1)
          PYEOF
          XAPK_URL=$(python3 /tmp/pick_xapk_url.py) || { echo "ERROR: could not pick the 1.9.1 XAPK URL from the APKPure API response" >&2; exit 1; }
          echo "XAPK URL found, downloading…"
          curl -sL --fail -o vividvocab.xapk "$XAPK_URL"
          ls -l vividvocab.xapk
          SIZE=$(stat -c%s vividvocab.xapk)
          echo "downloaded size: $SIZE (expected 163864965)"
          if [ "$SIZE" -lt 163000000 ] || [ "$SIZE" -gt 165000000 ]; then echo "ERROR: unexpected XAPK size $SIZE" >&2; exit 1; fi
          unzip -o vividvocab.xapk
          ls -l com.vividvocab.android.apk config.arm64_v8a.apk config.en.apk config.xxhdpi.apk
          unzip -l config.arm64_v8a.apk | grep -q "lib/arm64-v8a/libreactnative.so" || { echo "ERROR: config.arm64_v8a.apk lacks libreactnative.so" >&2; exit 1; }
          echo "XAPK verified: base + arm64 split with libreactnative.so present"

      # The emulator only lives for the duration of the emulator-runner step, so
      # logcat/screenshots must be taken inside that same session. They are in
      # their own script (diagnostics.sh) that always runs after launch.sh,
      # whatever launch.sh did. Every adb call is wrapped in `timeout`.
      - name: Write launch and diagnostics scripts
        run: |
          mkdir -p ci-scripts
          cat > ci-scripts/launch.sh <<'LAUNCH_EOF'
          #!/usr/bin/env bash
          # No `set -e`: nothing here may abort the step.
          PKG=com.vividvocab.android
          timeout 180 adb install-multiple -r com.vividvocab.android.apk config.arm64_v8a.apk config.en.apk config.xxhdpi.apk || echo "INSTALL FAILED or timed out"
          timeout 30 adb shell pm list packages | grep -i vividvocab || echo "PACKAGE NOT FOUND AFTER INSTALL"
          timeout 30 adb logcat -c || true
          # `am start -W` waits for the first frame and can hang forever; cap it.
          timeout 90 adb shell am start -W -n $PKG/$PKG.MainActivity > vividvocab-launch.txt 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "am start exited rc=$rc (124 = timed out after 90s), falling back to monkey" >> vividvocab-launch.txt
            timeout 60 adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1 >> vividvocab-launch.txt 2>&1 || true
          elif grep -qiE "Error|Exception|does not exist|FAILED" vividvocab-launch.txt; then
            echo "am start reported an error, falling back to monkey" >> vividvocab-launch.txt
            timeout 60 adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1 >> vividvocab-launch.txt 2>&1 || true
          fi
          cat vividvocab-launch.txt
          exit 0
          LAUNCH_EOF
          cat > ci-scripts/diagnostics.sh <<'DIAG_EOF'
          #!/usr/bin/env bash
          PKG=com.vividvocab.android
          timeout 30 adb exec-out screencap -p > vividvocab-first-screen.png || echo "first screenshot failed"
          timeout 30 adb shell pidof $PKG > vividvocab-pid-immediate.txt || echo "APP NOT RUNNING right after launch" > vividvocab-pid-immediate.txt
          echo "pid right after launch:" && cat vividvocab-pid-immediate.txt
          sleep 20
          timeout 30 adb exec-out screencap -p > vividvocab-after-20s.png || echo "20s screenshot failed"
          ls -l vividvocab-first-screen.png vividvocab-after-20s.png
          timeout 30 adb shell dumpsys window windows | grep -i -A3 -B3 vividvocab > vividvocab-window.txt || true
          timeout 30 adb shell pidof $PKG > vividvocab-pid.txt || echo "APP NOT RUNNING" > vividvocab-pid.txt
          echo "pid after 20s:" && cat vividvocab-pid.txt
          timeout 60 adb logcat -d > vividvocab-logcat.txt || true
          wc -l vividvocab-logcat.txt
          echo "===== crash-relevant logcat lines ====="
          grep -E "FATAL|AndroidRuntime|com\.vividvocab\.android|Process .* has died|ActivityManager.*(Start proc|Displayed|Force finishing|crash)|DEBUG|signal [0-9]+" vividvocab-logcat.txt | tail -n 200 || echo "(no matching lines)"
          echo "===== end crash-relevant lines ====="
          exit 0
          DIAG_EOF
          chmod +x ci-scripts/*.sh

      - name: Run app in emulator and capture diagnostics
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: |
            bash ci-scripts/launch.sh; bash ci-scripts/diagnostics.sh

      - name: Commit screenshot back to branch
        if: always()
        run: |
          git config user.name "muse-emulator-run"
          git config user.email "muse-emulator-run@users.noreply.github.com"
          mkdir -p vividvocab-emulator
          cp vividvocab-first-screen.png vividvocab-emulator/ 2>/dev/null || true
          cp vividvocab-window.txt vividvocab-emulator/ 2>/dev/null || true
          cp vividvocab-pid.txt vividvocab-emulator/ 2>/dev/null || true
          cp vividvocab-pid-immediate.txt vividvocab-emulator/ 2>/dev/null || true
          cp vividvocab-after-20s.png vividvocab-emulator/ 2>/dev/null || true
          cp vividvocab-logcat.txt vividvocab-emulator/ 2>/dev/null || true
          cp vividvocab-launch.txt vividvocab-emulator/ 2>/dev/null || true
          git add vividvocab-emulator/
          git commit -m "VividVocab emulator screenshot [skip ci]" || echo "nothing to commit"
          git push origin vividvocab-emulator || echo "push failed"

      - name: Upload screenshot as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vividvocab-screenshot
          path: |
            vividvocab-first-screen.png
            vividvocab-window.txt
            vividvocab-pid.txt
            vividvocab-pid-immediate.txt
            vividvocab-after-20s.png
            vividvocab-logcat.txt
            vividvocab-launch.txt
          if-no-files-found: warn
